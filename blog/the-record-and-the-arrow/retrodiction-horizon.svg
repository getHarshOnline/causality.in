<svg xmlns="http://www.w3.org/2000/svg" width="420" height="620" viewBox="0 0 420 620" role="img" aria-labelledby="plot-title plot-desc">
<title id="plot-title">Record noise and reconstruction horizon</title><desc id="plot-desc">At decay rate one, noise bounds 0.001 and 0.0001 reach the same error tolerance 0.1 at lookbacks 4.605 and 6.908. The smaller noise adds 2.303 time units.</desc>
