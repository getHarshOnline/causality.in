<text x="85.000" y="211.000" fill="var(--color-ink, #252c35)" font-family="var(--world-type-numeric-family, sans-serif)" font-size="20" text-anchor="end">1</text>
<path d="M100 420V426" fill="none" stroke="var(--color-ink, #252c35)" stroke-width="1.5"/>
