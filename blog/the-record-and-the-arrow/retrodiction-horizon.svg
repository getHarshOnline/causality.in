<text x="60.000" y="71.000" fill="var(--color-ink, #252c35)" font-family="var(--type-family-reading, sans-serif)" font-size="20" text-anchor="start">Noise bound 0.001</text>
<path d="M20 96H48" fill="none" stroke="var(--color-ink, #252c35)" stroke-width="2" stroke-dasharray="7 5"/>
<text x="60.000" y="103.000" fill="var(--color-ink, #252c35)" font-family="var(--type-family-reading, sans-serif)" font-size="20" text-anchor="start">Noise bound 0.0001</text>
<path d="M100 150V420H388" fill="none" stroke="var(--color-ink, #252c35)" stroke-width="1.5"/>
