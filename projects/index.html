  <script type="application/ld+json">{"@context":{"@version":1.1,"@vocab":"https://schema.org/","url":{"@id":"https://schema.org/url","@type":"@id"}},"@id":"https://causality.in/research/","@type":"WebPage","creativeWorkStatus":"published","description":"The calculus, local units, collective architectures and measurement tools behind Causality’s research programme.","hasPart":[{"@id":"_:faq_a8c169e7878ce2ccbdc916f772257d267891fa37f2b302f1206f751341355a05","@type":"FAQPage","isPartOf":{"@id":"https://causality.in/research/","identifier":"content:causality-projects"},"mainEntity":[{"@type":"Question","acceptedAnswer":{"@type":"Answer","text":"\u003cp\u003eCausality asks how a system can change its description and learn its own organisation, and these projects take the question in parts. MONAD asks what a change in description preserves. MUON studies one reasoning unit, HENA studies how units work together, and Reckon tests what memory contributes to a task. Q-MUON and Q-HENA ask related questions about a quantum unit and a quantum collective. Each page says what exists today.\u003c/p\u003e\n"},"name":"How do these projects fit together?"},{"@type":"Question","acceptedAnswer":{"@type":"Answer","text":"\u003cp\u003eFor a small mathematical example, \u003ca href=\"https://causality.in/monad/descriptions-and-repair/\" data-gazette-link=\"content:causality-projects#link-11\" data-gazette-destination-kind=\"internal-native\" data-gazette-destination-content=\"content:monad-docs\" data-gazette-destination-site=\"site:causality\" data-gazette-destination-theme=\"theme:lattice\"\u003efollow a part from stock count to repair\u003c/a\u003e: knowing it is available does not tell you whether it fits. To try an experiment, \u003ca href=\"https://causality.in/reckon/compare-replay-budgets/\" data-gazette-link=\"content:causality-projects#link-12\" data-gazette-destination-kind=\"internal-native\" data-gazette-destination-content=\"content:reckon-compare-replay-budgets\" data-gazette-destination-site=\"site:causality\" data-gazette-destination-theme=\"theme:lattice\"\u003egive a classifier two different replay budgets\u003c/a\u003e and compare how well it remembers its earlier tasks.\u003c/p\u003e\n"},"name":"Where should I begin?"}]},{"@type":"ItemList","itemListElement":[{"@type":"ListItem","item":{"@id":"https://causality.in/monad/#entity","@type":"ResearchProject","url":"https://causality.in/monad/"},"name":"MONAD","position":1},{"@type":"ListItem","item":{"@id":"https://causality.in/muon/#entity","@type":"ResearchProject","url":"https://causality.in/muon/"},"name":"MUON","position":2},{"@type":"ListItem","item":{"@id":"https://causality.in/reckon/#entity","@type":"SoftwareApplication","url":"https://causality.in/reckon/"},"name":"Reckon","position":3},{"@type":"ListItem","item":{"@id":"https://causality.in/hena/#entity","@type":"ResearchProject","url":"https://causality.in/hena/"},"name":"HENA","position":4},{"@type":"ListItem","item":{"@id":"https://causality.in/q-muon/#entity","@type":"ResearchProject","url":"https://causality.in/q-muon/"},"name":"Q-MUON","position":5},{"@type":"ListItem","item":{"@id":"https://causality.in/q-hena/#entity","@type":"ResearchProject","url":"https://causality.in/q-hena/"},"name":"Q-HENA","position":6}],"numberOfItems":6}],"http://www.w3.org/ns/prov#wasGeneratedBy":{"@type":"http://www.w3.org/ns/prov#Activity","http://www.w3.org/ns/prov#used":[{"@id":"https://rawthoughts.in/gazette/"},{"@id":"https://github.com/getHarshOnline/gazette-theme-lattice"}]},"identifier":"content:causality-projects","image":[{"@type":"ImageObject","contentUrl":"https://causality.in/assets/content/causality/media/relation-field/dark-0.png","description":"A dense constellation of points and fine connecting lines."},{"@type":"ImageObject","contentUrl":"https://causality.in/assets/content/causality/media/relation-field/dark-0.png","description":"A dense constellation of points and fine connecting lines."},{"@type":"ImageObject","contentUrl":"https://causality.in/assets/content/causality/media/relation-field/dark-0.png","description":"A dense constellation of points and fine connecting lines."},{"@type":"ImageObject","contentUrl":"https://causality.in/assets/content/causality/media/relation-field/dark-0.png","description":"A dense constellation of points and fine connecting lines."},{"@type":"ImageObject","contentUrl":"https://causality.in/assets/content/causality/media/relation-field/dark-0.png","description":"A dense constellation of points and fine connecting lines."},{"@type":"ImageObject","contentUrl":"https://causality.in/assets/content/causality/media/relation-field/dark-0.png","description":"A dense constellation of points and fine connecting lines."}],"inLanguage":"en","name":"Research projects","potentialAction":[{"@type":"ViewAction","target":"https://causality.in/collections/"},{"@type":"ViewAction","target":"https://post-agi-economics.org/"},{"@type":"ViewAction","target":"https://rawthoughts.in/products/"},{"@type":"ViewAction","target":"https://rawthoughts.in/services/"}],"publisher":{"@id":"https://rawthoughts.in/#organization","@type":"Organization","identifier":"organization:rtepl","name":"RawThoughts Enterprises Private Limited","sameAs":[{"@id":"https://github.com/getHarshOnline"}],"url":"https://rawthoughts.in/"},"text":"A dense constellation of points and fine connecting lines.\nMONAD\nAsk which distinctions survive when you compress or change a description. MONAD develops the mathematics in Lean, with a paper and a small Rust kernel.\nA dense constellation of points and fine connecting lines.\nMUON\nDesign a common interface for one reasoning unit, so a stock model and a unit that learns from experience can be compared on the same work.\nA dense constellation of points and fine connecting lines.\nReckon\nRun the same task at two memory budgets and see what changes. The local lab saves outcomes and shows which records were written, read or dropped.\nA dense constellation of points and fine connecting lines.\nHENA\nAsk whether small reasoning units can organise around a task when they can send only a few messages and keep only some of their past work.\nA dense constellation of points and fine connecting lines.\nQ-MUON\nExplore what a quantum implementation could change inside one reasoning unit while keeping MUON’s external interface.\nA dense constellation of points and fine connecting lines.\nQ-HENA\nExplore how quantum units might communicate, route work and share memory through entanglement. The design carries over HENA’s collective interfaces.\nFurther questions\nIntelligence in a working system\nReasoning has to meet the work around it. RawThoughts’ products make one system of that work, with people deciding. Pale is the meta harness through which they act, a harness over the tools people already use; it carries a goal forward through people, agents and applications, with useful context and the decisions that need a person kept in view.\nExplore the systems\nWhat cheaper intelligence changes\nAs cognitive work gets cheaper, constraints can move to energy, ownership and the institutions around production. Post-AGI Economics follows those consequences for firms, households and the models used to understand them.\nExplore the economic inquiry\nThe questions behind the models\nSmall examples can reveal what a description loses, what a collective can learn and what an evaluation actually establishes. Follow these questions through the programme’s connected writing.\nExplore the thoughts\nQuestions about the programme\nHow do these projects fit together?\nCausality asks how a system can change its description and learn its own organisation, and these projects take the question in parts. MONAD asks what a change in description preserves. MUON studies one reasoning unit, HENA studies how units work together, and Reckon tests what memory contributes to a task. Q-MUON and Q-HENA ask related questions about a quantum unit and a quantum collective. Each page says what exists today.\nWhere should I begin?\nFor a small mathematical example, follow a part from stock count to repair: knowing it is available does not tell you whether it fits. To try an experiment, give a classifier two different replay budgets and compare how well it remembers its earlier tasks.\n","url":"https://causality.in/research/","usageInfo":{"@id":"https://causality.in/terms/"}}</script>
