<path d="M176 168L180 174L184 168" fill="none" stroke="var(--color-ink, #252c35)" stroke-width="1.5"/>
<path d="M38 190H20V335H38 M302 190H320V335H302" fill="none" stroke="var(--color-accent, #215a83)" stroke-width="2"/>
<text x="180" y="216" fill="var(--color-ink, #252c35)" font-family="var(--type-family-reading, sans-serif)" font-size="20" font-weight="500" text-anchor="middle">Editable candidate</text>
<text x="180" y="253" fill="var(--color-ink, #252c35)" font-family="var(--type-family-reading, sans-serif)" font-size="20" font-weight="400" text-anchor="middle">Queue estimate</text>
<text x="180" y="280" fill="var(--color-ink, #252c35)" font-family="var(--type-family-reading, sans-serif)" font-size="20" font-weight="400" text-anchor="middle">Routing threshold</text>
<text x="180" y="307" fill="var(--color-ink, #252c35)" font-family="var(--type-family-reading, sans-serif)" font-size="20" font-weight="400" text-anchor="middle">Message policy</text>
<path d="M180 347V382" fill="none" stroke="var(--color-ink, #252c35)" stroke-width="1.5"/>
<path d="M176 376L180 382L184 376" fill="none" stroke="var(--color-ink, #252c35)" stroke-width="1.5"/>
<text x="180" y="408" fill="var(--color-ink, #252c35)" font-family="var(--type-family-reading, sans-serif)" font-size="20" font-weight="500" text-anchor="middle">Run</text>
<text x="180" y="438" fill="var(--color-ink, #252c35)" font-family="var(--type-family-reading, sans-serif)" font-size="20" font-weight="400" text-anchor="middle">Choices, costs</text>
<text x="180" y="465" fill="var(--color-ink, #252c35)" font-family="var(--type-family-reading, sans-serif)" font-size="20" font-weight="400" text-anchor="middle">and outcomes</text>
<path d="M285 438H402V265H332" fill="none" stroke="var(--color-ink, #252c35)" stroke-width="1.5"/>
<path d="M338 261L332 265L338 269" fill="none" stroke="var(--color-ink, #252c35)" stroke-width="1.5"/>
<text x="363" y="322" fill="var(--color-ink, #252c35)" font-family="var(--type-family-reading, sans-serif)" font-size="18" font-weight="400" text-anchor="middle">Update</text>
<text x="363" y="348" fill="var(--color-ink, #252c35)" font-family="var(--type-family-reading, sans-serif)" font-size="18" font-weight="400" text-anchor="middle">allowed</text>
<text x="363" y="374" fill="var(--color-ink, #252c35)" font-family="var(--type-family-reading, sans-serif)" font-size="18" font-weight="400" text-anchor="middle">state</text>
