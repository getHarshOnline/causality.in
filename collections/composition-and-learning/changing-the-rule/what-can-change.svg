<svg xmlns="http://www.w3.org/2000/svg" width="420" height="650" viewBox="0 0 420 650" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">What the routing candidate may change</title><desc id="figure-desc">A fixed workload flows through an editable candidate and its run to a protected evaluator. Run feedback updates only permitted candidate state.</desc>
<text x="180" y="35" fill="var(--color-ink, #252c35)" font-family="var(--type-family-reading, sans-serif)" font-size="20" font-weight="500" text-anchor="middle">Fixed workload</text>
<text x="180" y="67" fill="var(--color-ink, #252c35)" font-family="var(--type-family-reading, sans-serif)" font-size="20" font-weight="400" text-anchor="middle">Arrivals, service demands</text>
<text x="180" y="94" fill="var(--color-ink, #252c35)" font-family="var(--type-family-reading, sans-serif)" font-size="20" font-weight="400" text-anchor="middle">and seeds</text>
