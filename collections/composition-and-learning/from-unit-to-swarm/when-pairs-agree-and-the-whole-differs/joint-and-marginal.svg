<svg xmlns="http://www.w3.org/2000/svg" width="420" height="810" viewBox="0 0 420 810" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Joint laws and their pairwise marginals</title><desc id="figure-desc">The even law gives probability one quarter to 000, 011, 101 and 110. The odd law gives one quarter to the other four states. Every two-bit marginal is uniform under both laws.</desc>
<rect x="20" y="21" width="23" height="12" fill="var(--color-accent, #215a83)"/>
<text x="116" y="34" fill="var(--color-ink, #252c35)" font-family="var(--type-family-reading, sans-serif)" font-size="20" font-weight="400" text-anchor="middle">Even parity</text>
<rect x="230" y="21" width="23" height="12" fill="none" stroke="var(--color-ink, #252c35)" stroke-width="1.5"/>
<text x="322" y="34" fill="var(--color-ink, #252c35)" font-family="var(--type-family-reading, sans-serif)" font-size="20" font-weight="400" text-anchor="middle">Odd parity</text>
<text x="210" y="88" fill="var(--color-ink, #252c35)" font-family="var(--type-family-reading, sans-serif)" font-size="20" font-weight="500" text-anchor="middle">All three bits</text>
<text x="57" y="141" fill="var(--color-ink, #252c35)" font-family="var(--world-type-numeric-family, sans-serif)" font-size="20" font-weight="400" text-anchor="middle">000</text>
