<title id="figure-title">A request through the MUON slot</title><desc id="figure-desc">Caller requirements and filler capabilities inform estimated demand, compared with capacity and availability. Atomic reservation creates a lease or refuses. Inference and lifecycle events contribute ordered records to a host-owned store.</desc>
