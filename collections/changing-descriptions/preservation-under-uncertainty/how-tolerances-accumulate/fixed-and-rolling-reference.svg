<svg xmlns="http://www.w3.org/2000/svg" width="420" height="520" viewBox="0 0 420 520" role="img" aria-labelledby="tolerance-title tolerance-desc">
  <title id="tolerance-title">Fixed and rolling comparisons</title>
  <desc id="tolerance-desc">Bernoulli success probabilities are zero, 0.075 and 0.15. Both successive changes are within tolerance 0.1, but the second replacement is 0.15 from the initial law.</desc>
  <g fill="none" stroke="var(--color-ink, #252c35)" stroke-width="1.5">
    <path d="M85 170V390H375"/>
    <path d="M85 264.286H390" stroke-dasharray="2 5"/>
    <path d="M79 390.000H85"/>
    <path d="M79 295.714H85"/>
    <path d="M79 201.429H85"/>
    <path d="M85 390V396"/>
    <path d="M230 390V396"/>
    <path d="M375 390V396"/>
  </g>
  <g fill="none" stroke="var(--color-accent, #215a83)" stroke-width="2.3">
    <path d="M20 64H48"/>
    <path d="M85 390L230 295.714L375 201.429"/>
    <circle cx="85" cy="390.000" r="4.5" fill="var(--color-accent, #215a83)"/>
    <circle cx="230" cy="295.714" r="4.5" fill="var(--color-accent, #215a83)"/>
    <circle cx="375" cy="201.429" r="4.5" fill="var(--color-accent, #215a83)"/>
  </g>
  <g fill="none" stroke="var(--color-ink, #252c35)" stroke-width="1.8">
    <path d="M20 96H48" stroke-dasharray="6 4"/>
    <path d="M85 390L230 295.714H375" stroke-dasharray="6 4"/>
    <rect x="79" y="384.000" width="12" height="12"/>
    <rect x="224" y="289.714" width="12" height="12"/>
    <rect x="369" y="289.714" width="12" height="12"/>
  </g>
  <g fill="var(--color-ink, #252c35)" font-family="var(--type-family-reading, sans-serif)" font-size="20">
    <text x="20" y="28">Total-variation distance</text>
    <text x="59" y="71">From the initial law</text>
    <text x="59" y="103">From the previous law</text>
    <text x="95" y="249.286">Tolerance 0.1</text>
    <text x="230" y="458" text-anchor="middle">Replacement step</text>
    <text x="230" y="498" text-anchor="middle">Success probabilities: 0, 0.075, 0.15</text>
  </g>
  <g fill="var(--color-ink, #252c35)" font-family="var(--world-type-numeric-family, monospace)" font-size="20">
    <text x="70" y="397.000" text-anchor="end">0</text>
    <text x="70" y="302.714" text-anchor="end">0.075</text>
    <text x="70" y="208.429" text-anchor="end">0.15</text>
    <text x="85" y="425" text-anchor="middle">0</text>
    <text x="230" y="425" text-anchor="middle">1</text>
    <text x="375" y="425" text-anchor="middle">2</text>
  </g>
</svg>
